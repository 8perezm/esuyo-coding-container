name: Desktop builds

# Installable desktop app (Electron). Builds unsigned installers per OS,
# including MSIX on Windows. For signed/Store releases, add signing secrets
# and replace the MSIX placeholder identity in electron/electron-builder.yml.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: macos-latest
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build web GUI
        run: |
          npm --prefix web/client ci
          npm --prefix web/client run build

      - name: Install desktop dependencies
        run: npm --prefix electron ci

      - name: Build installers
        run: npm --prefix electron run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            electron/dist/*.exe
            electron/dist/*.msix
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.yml
