# Project-specific configuration for this repo's own container.
#
# Shared settings (registry, image build, k8s, nfs, ssh) come from the
# global config at ~/.config/coding-container/config.yaml; CLI flags override
# everything. Add keys here only for values that differ per project.

project: my-project

k8s:
  nodePort: 30022
  # namespace: unset here -> global default; use one name per developer for private work, or one shared name per team.
  # Pin the pod to one named cluster node (kubectl get nodes). Empty/unset ->
  # the scheduler picks a node.
  # nodeName: worker-02

# Expose container ports to the browser through Traefik: one Ingress rule per
# host ('hosts' list, or a single 'host'), each routing to that port on this
# project's service. The hosts must resolve (DNS) to your Traefik LoadBalancer
# IP. An optional nodePort (30000-32767) additionally reaches the port on every
# cluster node at http://<node-ip>:<nodePort>/ (unique across ssh, web.ports,
# sidecars).
# web:
#   ports:
#     - { port: 3000, hosts: [my-web.example.com, www.example.com], nodePort: 30080 }
#     - { port: 8080, host: my-api.example.com, name: api }

# Extra NAS folders mounted into the container alongside /workspace. Each
# subPath is a subfolder of nfs.basePath (created on first mount if missing);
# readOnly: true makes the mount read-only for the container.
# nfs:
#   volumes:
#     - { subPath: shared-datasets, mountPath: /data, readOnly: true }

# Rootless (non-root) coding pods are opt-in per project. Uncomment and match
# the image user (the shared image uses `ubuntu`, UID/GID 1000). Rootless
# projects need a /workspace folder writable by that UID on the NAS, and SSH
# moves to container port 2222 (the external NodePort stays the same):
# container:
#   user: ubuntu
#   uid: 1000
#   gid: 1000
#   home: /home/ubuntu
